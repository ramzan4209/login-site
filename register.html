<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-container {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .header-banner {
      background-color: #0d5c3d;
      color: #ffffff;
      padding: 30px 24px;
      text-align: center;
    }
    .header-banner h1 {
      font-size: 44px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .login-prompt {
      font-size: 14px;
      color: #808380;
      margin-top: 10px;
    }
    .login-prompt a {
      color: #04760a;
      text-decoration: none;
      font-weight: 600;
    }
    .login-prompt a:hover { text-decoration: underline; }
    .form-body { padding: 28px 24px; }
    #googleBtn {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider span {
      padding: 0 12px;
      font-weight: 500;
      color: #64748b;
    }
    .form-row { display: flex; gap: 10px; }
    .form-group { margin-bottom: 16px; flex: 1; }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    .phone-group { display: flex; gap: 8px; }
    .phone-group select { width: 105px; flex-shrink: 0; }
    .phone-group input { flex: 1; }
    .error-msg {
      color: #ef4444;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 4px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover { background-color: #059669; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="header-banner">
      <h1>Sign up</h1>
    </div>

    <div class="form-body">
      <!-- Google button is drawn here -->
      <div id="googleBtn"></div>

      <div class="divider">
        <span>Or Sign Up with Email</span>
      </div>

      <form id="registerForm" onsubmit="return validateForm(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="John" required>
          </div>
          <div class="form-group">
            <label for="secondName">Second Name</label>
            <input type="text" id="secondName" name="secondName" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group" style="margin-top: 14px;">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="13" max="120" placeholder="18" required>
          </div>
          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="phone-group">
            <select id="countryCode" name="countryCode" required>
              <option value="+91">+91 (IN)</option>
              <option value="+1">+1 (US)</option>
              <option value="+44">+44 (UK)</option>
              <option value="+61">+61 (AU)</option>
            </select>
            <input type="tel" id="phone" name="phone" placeholder="Mobile number" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min. 8 characters" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
          <div id="passwordError" class="error-msg">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn-submit">Register</button>
      </form>

      <div class="login-prompt">
        Already have an account? <a href="index.html">Login</a>
      </div>
    </div>
  </div>

<script>
  const GOOGLE_CLIENT_ID = '760051134655-p0oqgkhrajdsq12cef6qharpj1vdrum0.apps.googleusercontent.com';

  // Google sign-up button
  function initGoogle() {
    if (typeof google === 'undefined' || !google.accounts) {
      setTimeout(initGoogle, 300);
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential
    });
    google.accounts.id.renderButton(
      document.getElementById('googleBtn'),
      { theme: 'outline', size: 'large', width: 340, text: 'signup_with' }
    );
  }
  window.addEventListener('load', initGoogle);

  async function handleGoogleCredential(response) {
    try {
      const res = await fetch('/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential })
      });
      const data = await res.json();
      if (res.ok) {
        alert(data.message + ': ' + data.name);
        window.location.href = 'index.html';
      } else {
        alert(data.error);
      }
    } catch (err) {
      alert('Cannot reach server. Is node server.js running?');
    }
  }

  // Email registration
  async function validateForm(event) {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const passwordError = document.getElementById('passwordError');

    if (password !== confirmPassword) {
      passwordError.style.display = 'block';
      return false;
    }
    passwordError.style.display = 'none';

    try {
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firstName: document.getElementById('firstName').value.trim(),
          secondName: document.getElementById('secondName').value.trim(),
          age: document.getElementById('age').value,
          gender: document.getElementById('gender').value,
          email: document.getElementById('email').value.trim(),
          countryCode: document.getElementById('countryCode').value,
          phone: document.getElementById('phone').value.trim(),
          password: password
        })
      });
      const data = await res.json();
      if (res.ok) {
        alert(data.message);
        window.location.href = 'index.html';
      } else {
        alert(data.error);
      }
    } catch (err) {
      alert('Cannot reach server. Is node server.js running?');
    }
    return false;
  }
</script>

</body>
</html>
